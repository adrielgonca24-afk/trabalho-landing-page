<h1>Entre em Contato</h1>

<form action="#" method="post">

<label>Nome completo:</label><br>
<input type="text" name="nome"><br><br>

<label>Telefone:</label><br>
<input type="text" name="telefone"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Tipo de cliente:</label><br>
<input type="radio" name="tipo"> Pessoa Física<br>
<input type="radio" name="tipo"> Pessoa Jurídica<br><br>

<label>Melhor horário:</label><br>
<select name="horario">
    <option>Manhã</option>
    <option>Tarde</option>
    <option>Noite</option>
</select><br><br>

<label>Serviço desejado:</label><br>
<input type="checkbox"> Site simples<br>
<input type="checkbox"> Site intermediário<br>
<input type="checkbox"> Site avançado<br><br>

<label>Descrição:</label><br>
<textarea name="descricao"></textarea><br><br>

<input type="submit" value="Enviar">
<input type="reset" value="Limpar">

</form>
